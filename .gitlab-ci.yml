stages:
  - test

variables:
  GIT_STRATEGY: clone

# -----------------------------
# Generic template (hidden job)
# -----------------------------
.calculation_template:
  image: registry.gitlab.com/nambu-jona-lasinio-model/njl-model-mean-field-approximation:1.0

  stage: test

  before_script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"

  script:
    - echo "Running calculation: $CALC_DIR"
    - echo "Running script: $EXE_CALC_SCRIPT"
    - echo "Running plot script: $EXE_PLOT_SCRIPT"

    # Run calculation
    - cd calculations/$CALC_DIR && bash $EXE_CALC_SCRIPT
    - cd calculations/$CALC_DIR && bash $EXE_PLOT_SCRIPT

    # Return to repo root
    - cd "$CI_PROJECT_DIR"

    # Check reproducibility
    - git status --porcelain
    - git diff --stat

    - |
      if [ -n "$(git status --porcelain)" ]; then
        echo "ERROR: Working directory is not clean after execution"
        git status --porcelain
        exit 1
      else
        echo "SUCCESS: No changes detected"
      fi

su3_3d_cutoff_phase_diagram:
  extends: .calculation_template
  variables:
    CALC_DIR: "su3_3d_cutoff_phase_diagram"
    EXE_CALC_SCRIPT: "execute_calculations.sh" 
    EXE_PLOT_SCRIPT: "build_plots.sh"