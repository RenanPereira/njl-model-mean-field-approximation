stages:
  - test_modules
  - execute_calculations

variables:
  GIT_STRATEGY: clone

su3_3d_cutoff_quark_relaxation_times:
  image: registry.gitlab.com/nambu-jona-lasinio-model/njl-model-mean-field-approximation:1.0-gsl-2.8

  stage: execute_calculations

  script:
    - echo "Running NJL model calculations in Docker container"

    # Run calculations
    - (cd calculations/su3_3d_cutoff_quark_relaxation_times && bash execute_calculations.sh)
    #- (cd calculations/su3_3d_cutoff_quark_relaxation_times && bash build_plots.sh)

    # Return to repo root
    - cd "$CI_PROJECT_DIR"

    # Show changes for debugging
    - echo "Checking git status..."
    - git status --porcelain
    - git diff --stat

    # Fail pipeline if there are changes
    - |
      if [ -n "$(git status --porcelain)" ]; then
        echo "ERROR: Working directory is not clean after execution"
        echo "The following files were modified:"
        git status --porcelain
        exit 1
      else
        echo "SUCCESS: No changes detected"
      fi
