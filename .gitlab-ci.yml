stages:
  - test_modules
  - execute_calculations

variables:
  GIT_STRATEGY: clone

ini_file_parser:
  image: registry.gitlab.com/nambu-jona-lasinio-model/njl-model-mean-field-approximation:1.0

  stage: test_modules

  before_script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"

  script:
    - |
      cd tests/ini_file_parser

      make -j$(nproc)

      TEST_EXIT_CODE=0
      ./test.out || TEST_EXIT_CODE=$?

      make clean

      exit $TEST_EXIT_CODE

